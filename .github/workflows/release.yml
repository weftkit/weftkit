# Publishes a release to Maven Central when a v* tag is pushed: v1.2.3 releases 1.2.3.
# Secrets live in the "release" environment: MAVEN_CENTRAL_USERNAME/PASSWORD hold a
# central.sonatype.com token, SIGNING_KEY/SIGNING_KEY_PASSWORD an ASCII-armored GPG key.
# Verify publications locally with: ./gradlew publishToMavenLocal -Pversion=0.0.0-local
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:

  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The version comes from the tag (v1.2.3 -> 1.2.3), overriding the snapshot in gradle.properties
      - run: ./gradlew publishAndReleaseToMavenCentral -Pversion="${GITHUB_REF_NAME#v}" --no-daemon --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
