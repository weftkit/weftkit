[versions]
auto-service = "1.1.1"
junit = "5.11.4"
junit-platform = "1.11.4"
maven-publish = "0.34.0"
spotless = "8.8.0"

[libraries]
bukkit = { module = "org.bukkit:bukkit", version = "1.8-R0.1-SNAPSHOT" }
auto-service = { module = "com.google.auto.service:auto-service", version.ref = "auto-service" }
auto-service-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "auto-service" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
compile-testing = { module = "com.google.testing.compile:compile-testing", version = "0.21.0" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
