site_name: weftkit
site_description: Lifecycle and dependency injection framework for Bukkit Minecraft plugins, wired at compile time.
site_url: https://weftkit.org/
repo_url: https://github.com/weftkit/weftkit
repo_name: weftkit/weftkit
copyright: Copyright &copy; 2026 the weftkit authors

theme:
  name: material
  custom_dir: overrides
  font: false
  language: en
  logo: assets/logo/svg/weftkit-mark-weave.svg
  favicon: assets/favicon/favicon-32x32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

plugins:
  - search
  # The /go/ short links are permanent - never delete an entry, only repoint its target
  - redirects:
      redirect_maps:
        go/static-holder.md: annotations.md#migration-only

hooks:
  - hooks/sitemap.py
  - hooks/vars.py

extra:
  # Single source for the release version. hooks/vars.py substitutes the
  # {{ weftkit_version }} token in markdown; the page template reads it directly.
  weftkit_version: 0.6.0

extra_css:
  - stylesheets/tokens.css       # design tokens first — everything below references them
  - stylesheets/home.css         # hero + home-page layout + closing CTA
  - stylesheets/components.css   # terminal, dependency graph, FAQ, cards

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  # base_path is the repository root, so pages can embed example sources verbatim
  - pymdownx.snippets:
      base_path: !relative $config_dir/..
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Comparison: comparison.md
  - Concepts:
      - Components: components.md
      - Internal components: internal-components.md
      - Lifecycle: lifecycle.md
      - Listeners and commands: listeners-and-commands.md
      - Modules: modules.md
  - Examples:
      - Overview: examples/index.md
      - join-leave-messages: examples/join-leave-messages.md
      - player-homes: examples/player-homes.md
      - announcer: examples/announcer.md
  - Guides:
      - Distribution: distribution.md
      - Testing: testing.md
      - Metrics: metrics.md
  - Reference:
      - Annotations: annotations.md
      - Troubleshooting: troubleshooting.md

not_in_nav: |
  /impressum.md
  /datenschutz.md
